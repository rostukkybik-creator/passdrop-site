name: Update catalog prices
# Every 6 hours: read each priceRules entry in catalog.json from the operator's page, rewrite the
# catalog when a price changed, and commit. Phones fetch the new catalog and alert watched passes.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run the updater
        id: run
        run: |
          set +e
          swift tools/catalog-update.swift catalog.json > update.log 2>&1
          code=$?
          cat update.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
      - name: Commit when prices changed
        if: steps.run.outputs.code == '3'
        run: |
          git config user.name "passdrop-updater"
          git config user.email "rostukkybik-creator@users.noreply.github.com"
          git add catalog.json
          git commit -m "Catalog: observed price change $(date -u +%Y-%m-%d)" -m "$(grep CHANGED update.log)"
          git push
